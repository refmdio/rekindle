[package]
name = "client"
version = "0.1.0"
edition = "2024"
publish = false
[features]
desktop = []
web = []
[dependencies]
serde = { version = "1", features = ["derive"] }
[dev-dependencies]
egui_kittest = { version = "=0.35.0", features = ["eframe"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
env_logger = "0.11"
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence"] }
log = "0.4"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window"] }
[[bin]]
name = "web"
path = "src/bin/web.rs"
required-features = ["web"]
[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]
