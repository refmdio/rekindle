[package]
name = "client"
version = "0.1.0"
edition = "2024"
publish = false
[features]
desktop = []
web = []
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced = "=0.14.0"
[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "=0.14.0", default-features = false, features = ["wgpu", "webgl", "fira-sans"] }
wasm-bindgen = "=0.2.126"
[[bin]]
name = "web"
path = "src/bin/web.rs"
required-features = ["web"]
[[bin]]
name = "desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]
