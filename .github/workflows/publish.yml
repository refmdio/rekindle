name: CI and Publish

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rekindle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-24.04

    steps:
      - name: Check out the release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - name: Install native build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            build-essential \
            clang \
            cmake \
            inotify-tools \
            libasound2-dev \
            libfontconfig-dev \
            libfreetype-dev \
            libgl1-mesa-dev \
            libglib2.0-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Prepare Rust toolchains
        run: |
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain stable wasm32-unknown-unknown
          rustup toolchain install nightly --profile minimal --component rustfmt --component clippy
          rustup target add --toolchain nightly wasm32-unknown-unknown
          rustup run stable rustc --print target-libdir --target wasm32-unknown-unknown
          rustup run nightly rustc --print target-libdir --target wasm32-unknown-unknown

      - name: Restore dependencies and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: publish-${{ runner.os }}-otp-29-elixir-1.20-${{ hashFiles('mix.lock') }}

      - name: Install dependencies
        run: mix deps.get

      - name: Prepare wasm-bindgen
        run: |
          mix run --no-start -e '
            case Rekindle.Toolchain.install_wasm_bindgen() do
              {:ok, path} -> IO.puts(path)
              {:error, error} -> raise error
            end
          '

      - name: Match the release tag to the package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(
            mix run --no-compile --no-deps-check --no-start \
              -e 'IO.write(Mix.Project.config()[:version])'
          )"

          if [[ "$version" == *-* ]]; then
            echo "Refusing to publish prerelease package version: $version" >&2
            exit 1
          fi

          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $version" >&2
            exit 1
          fi

      - name: Verify the release
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix reach.check --arch --dead-code
          mix reach.check --smells --strict
          mix test
          mix docs --warnings-as-errors

      - name: Inspect the Hex publication
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --dry-run

      - name: Publish package and documentation
        if: github.event_name == 'release'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
